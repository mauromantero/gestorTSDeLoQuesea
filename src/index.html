<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de la Pràctica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


<div class="container">


    <div class="Controls">

        <div class="Titol"> <h1 class="title"> La bicho aventura (suspendeme) </h1></div>

        <div class="Formulari">

            <div class="card">
                <h2>Crea a tu bicho</h2>
                <div class="field">
                    <label for="iNom">Nombre:</label>
                    <input type="text" id="iNom" placeholder="Escribe el nombre de tu criatura">
                </div>

                <div class="field">
                    <label for="imatge">Apariéncia:</label>
                    <input type="file" id="imatge">
                </div>

                <div class="field">
                    <label for="iEdad">Edad:</label>
                    <input type="number" id="iEdad" value="0">
                </div>
                <h2>¿Está vivo?</h2>
                <div class="field-checkbox">
                    <label>
                        <input type="checkbox" id="cVida"> Si
                    </label>
                </div>

                <button id="btnAfegir">Afegir a la Llista</button>

            </div>
    </div>

        <div class="Buscador">

            <div class="card">
                <h2>Ordenar</h2>
                <button onclick="Ordenar()" style="margin:10px">Ordenar Nombres</button>
                <button onclick="OrdenarFel()" style="margin:10px">Ordenar Felicidad</button>
                <button onclick="OrdenarHam()" style="margin:10px">Ordenar Hambre</button>
                <div id="Ordenable">

                </div>
            </div>

        </div>

    </div>

    <div class="Mascotas info" id="contenedorAnim">

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
