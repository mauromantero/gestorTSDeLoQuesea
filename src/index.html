<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de la Pràctica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


<div class="container">


    <div class="Controls">

        <div class="Titol"> <h1 class="title"> La bicho aventura (suspendeme) </h1></div>

        <div class="Formulari">

            <div class="card">
                <div class="DivSecreto">

                <h2>Crea a tu bicho</h2>
                <button onclick="fade()" class="secretbutton" id="secreto" ></button>

                </div>
                <div class="field">
                    <label for="iNom">Nombre:</label>
                    <input type="text" id="iNom" placeholder="Escribe el nombre de tu criatura">
                </div>

                <div class="field">
                    <label for="imatge">Apariéncia:</label>
                    <select id="imatge">
                        <option value="Opción Z">Elije una opción </option>
                        <option value="Opción A">Momonga</option>
                        <option value="Opción B">Verity</option>
                        <option value="Opción C">Spiderman</option>
                    </select>
                </div>

                <div class="field">
                    <label for="iEdad">Edad:</label>
                    <input type="number" id="iEdad" value="0">
                </div>
                <h2>¿Está vivo?</h2>
                <div class="field-checkbox">
                    <label>
                        <input type="checkbox" id="cVida"> Si
                    </label>
                </div>

                <button id="btnAfegir">Afegir a la Llista</button>

            </div>
    </div>

        <div class="Buscador">

            <div class="card">
                <h2>Ordenar</h2>
                <button onclick="Ordenar()" style="margin:10px">Ordenar Nombres</button>
                <button onclick="OrdenarFel()" style="margin:10px">Ordenar Felicidad</button>
                <button onclick="OrdenarHam()" style="margin:10px">Ordenar Hambre</button>
                <button onclick="OrdenarEdad()" style="margin:10px">Ordenar Edad (Major - Menor)</button>
                <div id="Ordenable">

                </div>
            </div>

        </div>

    </div>

    <div class="Mascotas info" id="contenedorAnim">

    </div>

</div>

<div id="myModal" class="modal" style="justify-content:center;">

    <!-- Modal content -->
    <div class="modal-content">
        <div class="modal-header" style="text-align: center;">
            <h2 style="color: white" id="v1">¿Cómo me has encontrado?</h2>
        </div>
        <div class="modal-body">
            <p style="color: white; text-align: center " id="v2">Esto no deberia de estar pasando...</p>
            <button class="botoneleccion" style="background-color: #1b0707" onclick="respuesta1()" id="r1">¿Quién eres?</button>
            <button class="botoneleccion" style="background-color: #1b0707"  id="r2"><a href="index2.html">¡Dejame salir!</a></button>

    </div>

</div>
